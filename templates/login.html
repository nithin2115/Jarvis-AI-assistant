<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@200;300;400&family=Rajdhani:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── Reset ────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;
  background:#00040a;font-family:'Segoe UI',sans-serif;color:#fff;}

/* ── Canvas (fullscreen brain) ──────────────────────── */
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ── Login overlay (minimal, bottom-anchored) ─────────── */
#page{position:fixed;inset:0;z-index:20;pointer-events:none;}

#login{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:all;
  opacity:0;animation:loginIn 1.2s ease 1.4s forwards;}
@keyframes loginIn{to{opacity:1;}}

#login-label{font-size:7.5px;letter-spacing:6px;color:rgba(0,175,255,.32);
  text-transform:uppercase;margin-bottom:2px;}

#login-panel{position:relative;display:flex;flex-direction:column;gap:9px;
  background:rgba(0,5,18,.72);border:1px solid rgba(0,140,255,.16);
  border-radius:16px;padding:22px 28px;min-width:272px;
  backdrop-filter:blur(28px);
  box-shadow:0 0 50px rgba(0,80,200,.07),0 18px 50px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(0,150,255,.09);}
#login-panel::before{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,160,255,.45),transparent);}

/* Google button */
#gbtn{position:relative;display:flex;align-items:center;justify-content:center;
  gap:11px;padding:12px 18px;border-radius:11px;overflow:hidden;
  background:rgba(0,100,255,.09);border:1px solid rgba(255,255,255,.1);
  color:#cce3ff;font-size:12.5px;letter-spacing:.4px;text-decoration:none;
  transition:all .3s cubic-bezier(.16,1,.3,1);}
#gbtn:hover{background:rgba(0,130,255,.17);border-color:rgba(0,160,255,.42);
  box-shadow:0 0 28px rgba(0,130,255,.18);transform:translateY(-1px) scale(1.013);}
#gbtn:active{transform:none;}

/* Ripple */
.rpl{position:absolute;border-radius:50%;background:rgba(0,170,255,.22);
  transform:scale(0);animation:rplOut .55s linear forwards;pointer-events:none;}
@keyframes rplOut{to{transform:scale(4);opacity:0;}}

/* Demo button */
#dbtn{background:none;border:1px solid rgba(255,255,255,.07);
  color:rgba(255,255,255,.2);padding:9px;border-radius:10px;
  cursor:pointer;font-size:9px;letter-spacing:1px;transition:all .3s;}
#dbtn:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.5);}

/* Status */
#stat{font-size:8px;letter-spacing:.5px;color:rgba(255,60,60,.6);
  min-height:12px;text-align:center;}

/* OAuth warning */
.oauth-warn{background:rgba(255,140,0,.04);border:1px solid rgba(255,140,0,.14);
  border-radius:9px;padding:12px;font-size:10px;color:rgba(255,255,255,.28);
  line-height:1.8;}
.oauth-warn code{color:rgba(100,175,255,.5);}

/* Scan overlay */
#scan-ov{position:fixed;inset:0;z-index:60;background:rgba(0,2,8,0);
  pointer-events:none;display:flex;align-items:center;justify-content:center;
  transition:background .4s ease;opacity:0;}
#scan-ov.active{background:rgba(0,2,8,.72);opacity:1;}
.scan-box{border:1px solid rgba(0,160,255,.38);border-radius:12px;
  padding:36px 60px;text-align:center;position:relative;overflow:hidden;
  background:rgba(0,5,18,.68);backdrop-filter:blur(18px);}
.scan-bar{position:absolute;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,#00ccff,transparent);
  animation:scanMv 1.4s ease-in-out infinite;}
@keyframes scanMv{0%{top:0;opacity:1;}100%{top:100%;opacity:.2;}}
.scan-t{font-size:10px;letter-spacing:5px;color:rgba(0,200,255,.9);
  text-transform:uppercase;margin-bottom:6px;}
.scan-s{font-size:8px;letter-spacing:3px;color:rgba(0,150,255,.52);text-transform:uppercase;}

/* Exit */
#page.exit{animation:pgExit .6s ease forwards;}
@keyframes pgExit{to{opacity:0;transform:scale(1.03);}}

/* ── Title Block ──────────────────────────────────────── */
#title-block{position:absolute;top:17%;left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;z-index:2;}

#title-beam{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:660px;height:220px;
  background:radial-gradient(ellipse at center,rgba(0,140,255,.1) 0%,transparent 68%);
  pointer-events:none;overflow:hidden;
  animation:beamPulse 4.4s ease-in-out infinite;}
#title-beam::after{content:'';position:absolute;top:0;left:-65%;width:48%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,210,255,.055),transparent);
  animation:beamSweep 5.8s ease-in-out infinite 1.6s;}
@keyframes beamPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scaleX(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scaleX(1.1);}}
@keyframes beamSweep{0%{left:-65%;opacity:0;}18%{opacity:1;}100%{left:120%;opacity:0;}}

#title-shimmer{position:absolute;inset:-55px -90px;pointer-events:none;overflow:visible;}
.sp{position:absolute;width:1.8px;height:1.8px;border-radius:50%;
  background:rgba(80,205,255,.85);box-shadow:0 0 4px rgba(0,200,255,.5);
  animation:spkl var(--d) ease-in-out var(--dl) infinite alternate;}
@keyframes spkl{
  from{opacity:0;transform:translate(0,0) scale(.35);}
  to  {opacity:.9;transform:translate(var(--tx),var(--ty)) scale(1.4);}}

#jtitle{font-family:'Orbitron',sans-serif;
  font-size:clamp(42px,6.8vw,86px);font-weight:200;
  letter-spacing:.32em;text-indent:.32em;white-space:nowrap;
  color:#dff2ff;
  text-shadow:0 0 22px rgba(0,165,255,.92),0 0 55px rgba(0,125,255,.46),
              0 0 110px rgba(0,85,220,.2),0 0 200px rgba(0,60,200,.1);
  opacity:0;position:relative;
  animation:jTitleIn .9s cubic-bezier(.16,1,.3,1) .5s both,
            jTitleFlk 9s ease-in-out 2.4s infinite;
  will-change:opacity,transform;}
@keyframes jTitleIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@keyframes jTitleFlk{
  0%,87%,91%,100%{opacity:1;}
  88%{opacity:.84;}89%{opacity:1;}90%{opacity:.76;}90.5%{opacity:1;}}

#jsub{font-family:'Rajdhani','Segoe UI',sans-serif;
  font-size:clamp(7px,1.05vw,10px);font-weight:300;
  letter-spacing:.6em;text-indent:.6em;white-space:nowrap;
  color:rgba(100,188,255,.36);text-transform:uppercase;
  margin-top:11px;opacity:0;
  animation:jSubIn .7s ease 1.3s both;}
@keyframes jSubIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

#title-div{width:150px;height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,rgba(0,160,255,.3),transparent);
  opacity:0;animation:jSubIn .5s ease 1.7s both;}

#jquote{font-family:'Rajdhani','Segoe UI',sans-serif;
  font-size:clamp(10px,1.3vw,13px);font-weight:300;letter-spacing:.1em;
  color:rgba(125,200,255,.22);font-style:italic;
  margin-top:15px;max-width:480px;
  opacity:0;animation:jQuoteIn 1.1s ease 2.4s both;}
@keyframes jQuoteIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<!-- Fullscreen neural brain canvas -->
<canvas id="c"></canvas>

<!-- Minimal login overlay -->
<div id="page">

  <!-- Cinematic title -->
  <div id="title-block">
    <div id="title-beam"></div>
    <div id="title-shimmer"></div>
    <div id="jtitle">JARVIS</div>
    <div id="jsub">Neural Intelligence System</div>
    <div id="title-div"></div>
    <div id="jquote"></div>
  </div>

  <div id="login">
    <div id="login-label">Neural Access Interface</div>
    <div id="login-panel">
      {% if oauth_ready %}
      <a id="gbtn" href="/auth/google" onclick="return handleGoogle(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;position:relative;z-index:1;">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span style="position:relative;z-index:1;">Continue with Google</span>
      </a>
      {% else %}
      <div class="oauth-warn">
        Add <code>GOOGLE_CLIENT_ID</code> + <code>GOOGLE_CLIENT_SECRET</code> to <code>.env</code>
      </div>
      {% endif %}
      <button id="dbtn" onclick="demoLogin()">Enter Demo Mode</button>
      <div id="stat">{{ error or '' }}</div>
    </div>
  </div>
</div>

<!-- Scan overlay -->
<div id="scan-ov">
  <div class="scan-box">
    <div class="scan-bar"></div>
    <div class="scan-t">Authenticating</div>
    <div class="scan-s">Scanning identity...</div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   JARVIS — HYPER-REALISTIC AI BRAIN
   Multi-layer · Chain reactions · Energy waves · Sound reactive
════════════════════════════════════════════════════════════ */
(function () {
  const cvs = document.getElementById('c');
  const ctx  = cvs.getContext('2d');
  let W, H, CX, CY;

  /* ── Resize ──────────────────────────────────────────── */
  function resize() {
    W = cvs.width  = innerWidth;
    H = cvs.height = innerHeight;
    CX = W / 2; CY = H / 2 - H * 0.03;
  }

  /* ══ LAYER CONFIG ════════════════════════════════════════
     Layer 0 = outer shell  (sparse, dim, slow flicker)
     Layer 1 = mid mantle   (dense, normal)
     Layer 2 = core         (bright, fast, hot)             */
  const LCFG = [
    { n:30, rMin:0.72, rMax:1.00, rs:1.0, gm:0.50, fs:0.014 },
    { n:40, rMin:0.38, rMax:0.72, rs:1.3, gm:0.88, fs:0.026 },
    { n:20, rMin:0.00, rMax:0.38, rs:1.8, gm:1.40, fs:0.042 },
  ];

  const NODES = [], EDGES = [];

  /* simple hash noise –1…1 */
  function hn(i) { return ((Math.sin(i * 127.1) * 43758.5453) % 1 + 1) % 1 * 2 - 1; }

  function genBrain() {
    NODES.length = 0;
    let idx = 0;
    const SC = Math.min(W, H) * 0.33;
    for (let li = 0; li < LCFG.length; li++) {
      const cfg = LCFG[li];
      for (let k = 0; k < cfg.n; k++) {
        const side = Math.random() < 0.5 ? -1 : 1;
        let x, y, z, mag, tries = 0;
        do {
          x = Math.random()*2-1; y = Math.random()*2-1; z = Math.random()*2-1;
          mag = Math.sqrt(x*x*0.85 + y*y + z*z*1.1);
          tries++;
        } while ((mag < cfg.rMin || mag > cfg.rMax) && tries < 60);

        /* organic noise perturbation */
        const bx = (x*86 + side*23 + hn(idx*3.1)*12) * SC/220;
        const by = (y*64          + hn(idx*5.7)*10) * SC/220;
        const bz = (z*53          + hn(idx*7.3)* 9) * SC/220;

        NODES.push({ bx, by, bz, layer: li, cfg,
          r:   (1.3 + Math.random()*2.3) * cfg.rs,
          flk: Math.random()*Math.PI*2,
          fsp: cfg.fs * (0.7 + Math.random()*0.6),
          eflk: Math.random()*Math.PI*2,
          efsp: 0.009 + Math.random()*0.022,
          vio: Math.random() < (li===2 ? 0.22 : 0.07),
          hot: li===2 && Math.random() < 0.18,
          firing: 0,
        });
        idx++;
      }
    }
  }

  function genEdges() {
    EDGES.length = 0;
    const SC = Math.min(W, H) * 0.33;
    const DMAX = [42, 56, 50];
    const cap  = new Int16Array(NODES.length);
    const MAX  = 4;
    for (let i = 0; i < NODES.length; i++) {
      for (let j = i+1; j < NODES.length; j++) {
        if (cap[i] >= MAX || cap[j] >= MAX) continue;
        const dx=NODES[i].bx-NODES[j].bx, dy=NODES[i].by-NODES[j].by, dz=NODES[i].bz-NODES[j].bz;
        const d = Math.sqrt(dx*dx+dy*dy+dz*dz);
        const thr = DMAX[Math.min(NODES[i].layer, NODES[j].layer)] * SC/220;
        if (d < thr) { EDGES.push([i, j, d/thr]); cap[i]++; cap[j]++; }
      }
    }
    /* build adjacency list for chain reactions */
    NODES.forEach(n => { n.adj = []; });
    EDGES.forEach(([a,b]) => { NODES[a].adj.push(b); NODES[b].adj.push(a); });
  }

  /* ══ AMBIENT PARTICLES ══════════════════════════════════ */
  const AMB = [];
  function genAmb() {
    AMB.length = 0;
    const SC = Math.min(W, H) * 0.34;
    for (let i = 0; i < 30; i++) {
      const ang = Math.random()*Math.PI*2;
      const d   = SC*0.52 + Math.random()*SC*0.78;
      AMB.push({ x:Math.cos(ang)*d, y:(Math.random()-0.5)*SC*0.6, z:Math.sin(ang)*d,
        vx:(Math.random()-0.5)*0.09, vy:(Math.random()-0.5)*0.06, vz:(Math.random()-0.5)*0.09,
        r:0.35+Math.random()*0.6, a:0.04+Math.random()*0.09,
        ph:Math.random()*Math.PI*2, ps:0.004+Math.random()*0.008 });
    }
  }

  /* ══ PULSES ══════════════════════════════════════════════ */
  const PULSES = [];
  let pClock = 0;

  function spawnPulse(edgeArr, startT) {
    if (PULSES.length >= 20) return;
    const e = edgeArr || EDGES[Math.floor(Math.random()*EDGES.length)];
    if (!e) return;
    PULSES.push({ a:e[0], b:e[1], t:startT||0,
      spd: 0.005 + Math.random()*0.009 + audioLevel*0.005,
      al:  0.72 + Math.random()*0.28 });
  }

  function triggerChain(nIdx) {
    const adj = NODES[nIdx].adj || [];
    adj.forEach(nb => {
      if (Math.random() < 0.38 + audioLevel*0.18) {
        const delay = 80 + Math.random()*180;
        setTimeout(() => {
          const e = EDGES.find(([a,b]) => (a===nIdx&&b===nb)||(b===nIdx&&a===nb));
          if (e) spawnPulse(e, e[0]===nIdx ? 0 : 1);
        }, delay);
      }
    });
  }

  /* ══ ENERGY WAVES ════════════════════════════════════════ */
  const WAVES = [];
  let wClock = 0;

  function spawnWave(fromClick) {
    if (WAVES.length >= 3) return;
    const maxR = Math.min(W,H) * (0.45 + Math.random()*0.1);
    WAVES.push({ r:0, maxR, al: fromClick ? 0.28 : (0.14 + audioLevel*0.1), spd: 1.0 + audioLevel*0.7 });
  }

  /* ══ SPARKS ══════════════════════════════════════════════ */
  const SPARKS = [];
  function spawnSpark(sx, sy) {
    if (SPARKS.length >= 12) return;
    for (let i = 0; i < 2; i++) {
      const ang = Math.random()*Math.PI*2;
      const spd = 0.5 + Math.random()*1.3;
      SPARKS.push({ x:sx, y:sy, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
        life:1, decay:0.04+Math.random()*0.05 });
    }
  }

  /* ══ AUDIO ═══════════════════════════════════════════════ */
  let audioLevel = 0, analyser = null, audioData = null;

  function initAudio() {
    if (analyser) return;
    navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(stream => {
      const ac = new (window.AudioContext||window.webkitAudioContext)();
      analyser = ac.createAnalyser(); analyser.fftSize = 256;
      audioData = new Uint8Array(analyser.frequencyBinCount);
      ac.createMediaStreamSource(stream).connect(analyser);
    }).catch(()=>{});
  }

  function readAudio() {
    if (!analyser) return;
    analyser.getByteFrequencyData(audioData);
    const avg = audioData.reduce((s,v)=>s+v,0)/audioData.length;
    audioLevel = Math.max(audioLevel*0.88, Math.min(1, avg/55));
    window._jAL = audioLevel;
  }

  /* ══ 3D PROJECTION + PARALLAX ════════════════════════════ */
  let rotY = 0;
  let mX = 0, mY = 0, pmX = 0, pmY = 0;
  const TILT = 0.16, FOV = 480;
  const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

  function project(bx, by, bz) {
    const angY  = rotY + pmX * 0.022;
    const cosY  = Math.cos(angY), sinY = Math.sin(angY);
    const x1    = bx*cosY + bz*sinY;
    const z1    = bz*cosY - bx*sinY;
    const offY  = pmY * 14;
    const y2    = (by+offY)*cosT - z1*sinT;
    const z2    = (by+offY)*sinT + z1*cosT;
    const sc    = FOV / (FOV + z2);
    return { sx: CX+x1*sc, sy: CY+y2*sc, z: z2, sc };
  }

  /* depth+layer alpha — back=dim, front=bright, layer scales glow */
  function depthA(z, base, lm) {
    return base * lm * Math.max(0.06, Math.min(1, (z+260)/360));
  }

  /* ══ DRAW ════════════════════════════════════════════════ */
  let PROJ = [];
  let coreBreath = 0;

  function projectAll() { PROJ = NODES.map(n => project(n.bx, n.by, n.bz)); }

  function drawCoreGlow() {
    coreBreath = 0.5 + 0.5*Math.sin(performance.now()*0.00115);
    const intensity = 0.5 + coreBreath*0.38 + audioLevel*0.28;
    const SC = Math.min(W,H)*0.34;
    const r  = SC * (0.52 + coreBreath*0.12 + audioLevel*0.1);
    const ox = pmX*9, oy = pmY*7;
    const g  = ctx.createRadialGradient(CX+ox, CY+oy, 0, CX+ox, CY+oy, r);
    g.addColorStop(0,   `rgba(80,190,255,${(intensity*0.20).toFixed(2)})`);
    g.addColorStop(0.35,`rgba(0,140,255,${(intensity*0.09).toFixed(2)})`);
    g.addColorStop(1,   'rgba(0,50,200,0)');
    ctx.beginPath(); ctx.arc(CX+ox, CY+oy, r, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    /* white-hot inner flash when energy spikes */
    if (audioLevel > 0.55) {
      const fr = SC * 0.12 * audioLevel;
      const fg = ctx.createRadialGradient(CX, CY, 0, CX, CY, fr);
      fg.addColorStop(0, `rgba(220,240,255,${(audioLevel*0.18).toFixed(2)})`);
      fg.addColorStop(1, 'rgba(100,180,255,0)');
      ctx.beginPath(); ctx.arc(CX, CY, fr, 0, Math.PI*2); ctx.fillStyle=fg; ctx.fill();
    }
  }

  function drawWaves() {
    for (let i = WAVES.length-1; i >= 0; i--) {
      const w = WAVES[i];
      w.r += w.spd;
      const al = w.al * (1 - w.r/w.maxR) * (1 - w.r/w.maxR);
      if (al < 0.004 || w.r >= w.maxR) { WAVES.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(CX, CY, w.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,165,255,${al.toFixed(3)})`; ctx.lineWidth=1.1; ctx.stroke();
      /* faint inner fill */
      const ig = ctx.createRadialGradient(CX,CY,w.r*0.85,CX,CY,w.r);
      ig.addColorStop(0,'rgba(0,130,255,0)');
      ig.addColorStop(1,`rgba(0,100,255,${(al*0.18).toFixed(3)})`);
      ctx.beginPath(); ctx.arc(CX,CY,w.r,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
    }
  }

  function drawEdges() {
    for (let k = 0; k < EDGES.length; k++) {
      const [a, b, nD] = EDGES[k];
      const pa = PROJ[a], pb = PROJ[b];
      const na = NODES[a], nb = NODES[b];
      na.eflk = (na.eflk + na.efsp) % (Math.PI*2);
      const flk = 0.5 + 0.5*Math.sin(na.eflk);
      const mz  = (pa.z + pb.z)*0.5;
      const lf  = (na.layer + nb.layer + 2) / 6;
      const al  = depthA(mz, (0.055 + lf*0.09)*flk, 1) * (1 - nD*0.38);
      if (al < 0.005) continue;
      const fire = Math.max(na.firing, nb.firing);
      const g   = ctx.lineWidth = 0.38 + lf*0.3;
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy);
      ctx.strokeStyle = `rgba(${fire>0.3?'60,':'0,'}${Math.round(145+fire*90)},255,${al.toFixed(3)})`;
      ctx.stroke();
    }
  }

  function drawPulses() {
    for (let i = PULSES.length-1; i >= 0; i--) {
      const p = PULSES[i];
      p.t += p.spd;
      if (p.t >= 1) {
        const dest = NODES[p.b];
        dest.firing = Math.min(1, dest.firing + 0.75);
        if (Math.random() < 0.36 + audioLevel*0.22) triggerChain(p.b);
        const dp = PROJ[p.b];
        if (dp && Math.random() < 0.32) spawnSpark(dp.sx, dp.sy);
        PULSES.splice(i,1); continue;
      }
      const na=NODES[p.a], nb=NODES[p.b];
      const px=na.bx+(nb.bx-na.bx)*p.t, py=na.by+(nb.by-na.by)*p.t, pz=na.bz+(nb.bz-na.bz)*p.t;
      const {sx,sy,z,sc}=project(px,py,pz);
      const al=depthA(z, p.al, 1);
      const r=1.9*sc;
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r*5);
      g.addColorStop(0,  `rgba(120,240,255,${(al*0.96).toFixed(2)})`);
      g.addColorStop(0.3,`rgba(0,200,255,${(al*0.38).toFixed(2)})`);
      g.addColorStop(1,  'rgba(0,100,255,0)');
      ctx.beginPath(); ctx.arc(sx,sy,r*5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    }
  }

  function drawNodes() {
    const order = PROJ.map((p,i)=>[i,p.z]).sort((a,b)=>a[1]-b[1]);
    for (const [i] of order) {
      const n = NODES[i];
      const {sx,sy,z,sc} = PROJ[i];
      n.flk = (n.flk + n.fsp) % (Math.PI*2);
      n.firing = Math.max(0, n.firing - 0.022);
      const flk  = 0.68 + 0.32*Math.sin(n.flk);
      const al   = depthA(z, flk, n.cfg.gm);
      const fire = n.firing;
      const r    = n.r * sc * flk * (1 + fire*0.55 + audioLevel*0.15);

      let col, ecol;
      if (n.hot && fire > 0.25) { col=`230,${Math.round(210+fire*45)},255`; ecol='180,100,255'; }
      else if (n.vio)            { col='115,65,255'; ecol='70,28,220'; }
      else                       { col=`0,${Math.round(185+fire*55+audioLevel*18)},255`; ecol='0,125,255'; }

      /* soft depth-of-field blur for far nodes */
      const dofBlur = Math.max(0, -z / 280);
      if (dofBlur > 0.15) ctx.filter = `blur(${(dofBlur*1.8).toFixed(1)}px)`;

      const hr = r*(6.5 + fire*4.5 + audioLevel*2.5);
      const halo = ctx.createRadialGradient(sx,sy,0,sx,sy,hr);
      halo.addColorStop(0, `rgba(${col},${(al*(0.2+fire*0.28)).toFixed(2)})`);
      halo.addColorStop(1, `rgba(${ecol},0)`);
      ctx.beginPath(); ctx.arc(sx,sy,hr,0,Math.PI*2); ctx.fillStyle=halo; ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${col},${(al*0.94).toFixed(2)})`; ctx.fill();
      ctx.filter = 'none';
    }
  }

  function drawAmb() {
    const PULL = 0.0006 + audioLevel*0.0012;
    for (const p of AMB) {
      p.x+=p.vx; p.y+=p.vy; p.z+=p.vz; p.ph+=p.ps;
      p.vx-=p.x*PULL; p.vy-=p.y*PULL; p.vz-=p.z*PULL;
      const spd=Math.hypot(p.vx,p.vy,p.vz);
      if(spd>0.14){p.vx*=0.14/spd;p.vy*=0.14/spd;p.vz*=0.14/spd;}
      const {sx,sy,z,sc}=project(p.x,p.y,p.z);
      const al=depthA(z, p.a*(0.4+0.6*Math.sin(p.ph)), 1);
      if(al<0.01)continue;
      ctx.beginPath(); ctx.arc(sx,sy,p.r*sc,0,Math.PI*2);
      ctx.fillStyle=`rgba(30,148,255,${al.toFixed(2)})`; ctx.fill();
    }
  }

  function drawSparks() {
    for (let i=SPARKS.length-1; i>=0; i--) {
      const s=SPARKS[i];
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay; s.vx*=0.91; s.vy*=0.91;
      if(s.life<=0){SPARKS.splice(i,1);continue;}
      ctx.beginPath(); ctx.arc(s.x,s.y,1.4*s.life,0,Math.PI*2);
      ctx.fillStyle=`rgba(160,235,255,${s.life.toFixed(2)})`; ctx.fill();
    }
  }

  /* ══ FRAME LOOP ══════════════════════════════════════════ */
  function frame() {
    ctx.clearRect(0, 0, W, H);

    readAudio();
    rotY += 0.00052 + audioLevel*0.00038;
    pmX += (mX - pmX)*0.042;
    pmY += (mY - pmY)*0.042;

    projectAll();
    drawCoreGlow();
    drawWaves();
    drawEdges();
    drawAmb();
    drawPulses();
    drawSparks();
    drawNodes();

    /* spawn pulses */
    pClock++;
    if (pClock >= Math.max(20, 40 - Math.round(audioLevel*14)) && PULSES.length < 20) {
      spawnPulse(); pClock = 0;
    }
    /* spawn waves */
    wClock++;
    if (wClock >= Math.max(90, 210 - Math.round(audioLevel*100))) {
      spawnWave(); wClock = 0;
    }

    requestAnimationFrame(frame);
  }

  /* ══ INIT ════════════════════════════════════════════════ */
  resize();
  genBrain(); genEdges(); genAmb();
  spawnWave(); /* initial wave on load */
  frame();

  window.addEventListener('resize', () => { resize(); genBrain(); genEdges(); genAmb(); });
  window.addEventListener('mousemove', e => {
    mX = (e.clientX - W*0.5) / (W*0.5);
    mY = (e.clientY - H*0.5) / (H*0.5);
  });
  cvs.addEventListener('click', () => {
    spawnWave(true);
    /* boost energy */
    NODES.forEach(n => { if (n.layer===2) n.firing=Math.min(1,n.firing+0.35); });
    initAudio();
  });
  /* init audio on first user interaction */
  document.addEventListener('click', initAudio, { once:true });
})();

/* ════════════════════════════════════════════════════════════
   RIPPLE
════════════════════════════════════════════════════════════ */
function addRipple(e, btn) {
  const rect = btn.getBoundingClientRect();
  const el   = document.createElement('span');
  el.className = 'rpl';
  const sz = Math.max(rect.width, rect.height);
  el.style.cssText =
    `width:${sz}px;height:${sz}px;` +
    `left:${e.clientX - rect.left - sz/2}px;` +
    `top:${e.clientY  - rect.top  - sz/2}px;`;
  btn.appendChild(el);
  setTimeout(() => el.remove(), 580);
}

/* ════════════════════════════════════════════════════════════
   GOOGLE LOGIN
════════════════════════════════════════════════════════════ */
function handleGoogle(e) {
  e.preventDefault();
  const btn  = document.getElementById('gbtn');
  const dest = btn.getAttribute('href');
  addRipple(e, btn);
  const ov = document.getElementById('scan-ov');
  ov.style.pointerEvents = 'all';
  requestAnimationFrame(() => ov.classList.add('active'));
  setTimeout(() => document.getElementById('page').classList.add('exit'), 350);
  setTimeout(() => { window.location.href = dest; }, 920);
  return false;
}

/* ════════════════════════════════════════════════════════════
   TITLE — quote · shimmer sparks · parallax · audio glow sync
════════════════════════════════════════════════════════════ */
(function(){
  /* Random quote */
  const QUOTES = [
    '“I learn. I adapt. I assist.”',
    '“Intelligence is not artificial. It is engineered.”',
    '“Beyond commands. Into understanding.”',
    '“Not a tool. An evolution.”',
    '“Your system. Your assistant. Your intelligence.”',
  ];
  document.getElementById('jquote').textContent =
    QUOTES[Math.floor(Math.random() * QUOTES.length)];

  /* Shimmer sparks around title */
  const shimmer = document.getElementById('title-shimmer');
  for (let i = 0; i < 22; i++) {
    const sp = document.createElement('span');
    sp.className = 'sp';
    const tx = ((Math.random() - .5) * 360).toFixed(0);
    const ty = ((Math.random() - .5) * 115).toFixed(0);
    sp.style.cssText =
      `left:${(15 + Math.random()*70).toFixed(1)}%;` +
      `top:${(15 + Math.random()*70).toFixed(1)}%;` +
      `--d:${(1.5 + Math.random()*2.9).toFixed(2)}s;` +
      `--dl:${(Math.random()*4.5).toFixed(2)}s;` +
      `--tx:${tx}px;--ty:${ty}px;`;
    shimmer.appendChild(sp);
  }

  /* Parallax + audio glow sync */
  const tb = document.getElementById('title-block');
  const jt = document.getElementById('jtitle');
  let tx2=0, ty2=0, ptx=0, pty=0;

  window.addEventListener('mousemove', e => {
    tx2 = (e.clientX / innerWidth  - .5) * 11;
    ty2 = (e.clientY / innerHeight - .5) *  5;
  });

  const BASE_GLOW =
    '0 0 22px rgba(0,165,255,.92),' +
    '0 0 55px rgba(0,125,255,.46),' +
    '0 0 110px rgba(0,85,220,.2),'  +
    '0 0 200px rgba(0,60,200,.1)';

  function tick() {
    ptx += (tx2 - ptx) * .046;
    pty += (ty2 - pty) * .046;
    tb.style.transform =
      `translateX(calc(-50% + ${ptx.toFixed(2)}px)) translateY(${pty.toFixed(2)}px)`;

    const al = window._jAL || 0;
    if (al > 0.05) {
      const g1 = (22 + al*32).toFixed(0), g2 = (55+al*65).toFixed(0);
      const g3 = (110+al*85).toFixed(0), g4 = (200+al*90).toFixed(0);
      jt.style.textShadow =
        `0 0 ${g1}px rgba(0,165,255,${(.92+al*.08).toFixed(2)}),` +
        `0 0 ${g2}px rgba(0,130,255,${(.46+al*.32).toFixed(2)}),` +
        `0 0 ${g3}px rgba(0,90,220,${(.2+al*.24).toFixed(2)}),`  +
        `0 0 ${g4}px rgba(0,60,200,${(.1+al*.18).toFixed(2)})`;
    } else {
      jt.style.textShadow = BASE_GLOW;
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
